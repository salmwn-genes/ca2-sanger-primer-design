<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480">
  <rect width="1200" height="480" fill="#ffffff"/>

  <text x="600" y="55" text-anchor="middle"
        font-family="Arial" font-size="28" font-weight="bold" fill="#202b3c">
    CA2 PCR Amplicon and Primer Map
  </text>

  <text x="600" y="88" text-anchor="middle"
        font-family="Arial" font-size="17" fill="#667085">
    hg19 reference | 1001 bp template
  </text>

  <!-- Template -->
  <line x1="80" y1="225" x2="1120" y2="225"
        stroke="#344054" stroke-width="5" stroke-linecap="round"/>

  <!-- Amplicon -->
  <line x1="274.5" y1="190" x2="781" y2="190"
        stroke="#12A594" stroke-width="9" stroke-linecap="round"/>

  <text x="527" y="165" text-anchor="middle"
        font-family="Arial" font-size="19" font-weight="bold" fill="#087F70">
    Amplicon: 488 bp
  </text>

  <!-- Forward primer -->
  <line x1="274.5" y1="225" x2="294.3" y2="225"
        stroke="#2878C8" stroke-width="13"/>
  <path d="M294 215 L309 225 L294 235 Z" fill="#2878C8"/>

  <line x1="284" y1="225" x2="284" y2="285"
        stroke="#2878C8" stroke-width="2"/>

  <text x="284" y="315" text-anchor="middle"
        font-family="Arial" font-size="19" font-weight="bold" fill="#2878C8">
    Forward primer
  </text>
  <text x="284" y="342" text-anchor="middle"
        font-family="Arial" font-size="17" fill="#344054">
    188–207
  </text>

  <!-- Reverse primer -->
  <line x1="761.2" y1="225" x2="781" y2="225"
        stroke="#D97735" stroke-width="13"/>
  <path d="M761 215 L746 225 L761 235 Z" fill="#D97735"/>

  <line x1="771" y1="225" x2="771" y2="285"
        stroke="#D97735" stroke-width="2"/>

  <text x="771" y="315" text-anchor="middle"
        font-family="Arial" font-size="19" font-weight="bold" fill="#D97735">
    Reverse primer
  </text>
  <text x="771" y="342" text-anchor="middle"
        font-family="Arial" font-size="17" fill="#344054">
    656–675
  </text>

  <!-- Variant -->
  <line x1="600" y1="135" x2="600" y2="245"
        stroke="#C43D4B" stroke-width="3" stroke-dasharray="6,5"/>
  <circle cx="600" cy="225" r="9" fill="#C43D4B"/>

  <text x="600" y="115" text-anchor="middle"
        font-family="Arial" font-size="19" font-weight="bold" fill="#C43D4B">
    Variant: G&gt;A
  </text>
  <text x="600" y="265" text-anchor="middle"
        font-family="Arial" font-size="16" fill="#C43D4B">
    Position 501
  </text>

  <!-- Scale -->
  <g font-family="Arial" font-size="15" fill="#667085" text-anchor="middle">
    <text x="80" y="385">1</text>
    <text x="288" y="385">201</text>
    <text x="496" y="385">401</text>
    <text x="704" y="385">601</text>
    <text x="912" y="385">801</text>
    <text x="1120" y="385">1001 bp</text>
  </g>

  <line x1="80" y1="360" x2="1120" y2="360"
        stroke="#98A2B3" stroke-width="1.5"/>

  <text x="600" y="435" text-anchor="middle"
        font-family="Arial" font-size="15" fill="#667085">
    Schematic representation of primer positions and target variant
  </text>
</svg>
